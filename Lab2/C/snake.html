
<!DOCTYPE html>
<html>
<head>
    <title>Snake Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
        }

        canvas {
            background-color: #222;
            border: 3px solid black;
        }

        h1 {
            color: green;
        }
    </style>
</head>
<body>

    <h1>Snake Game</h1>
    <p>Use arrow keys to move the snake.</p>
    <h3>Score: <span id="score">0</span></h3>

    <canvas id="game" width="400" height="400"></canvas>
    <br><br>
    <button onclick="startGame()">Start / Restart</button>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const box = 20;
        let snake, food, dx, dy, score, game;
        let running = false;

        function startGame() {
            clearInterval(game);

            snake = [{ x: 200, y: 200 }];
            food = createFood();
            dx = box;
            dy = 0;
            score = 0;
            running = true;

            scoreElement.textContent = score;
            drawGame();

            game = setInterval(updateGame, 150);
        }

        function createFood() {
            return {
                x: Math.floor(Math.random() * (canvas.width / box)) * box,
                y: Math.floor(Math.random() * (canvas.height / box)) * box
            };
        }

        document.addEventListener("keydown", function (event) {
            const key = event.key;

            if (key === "ArrowUp" && dy === 0) {
                dx = 0;
                dy = -box;
            } else if (key === "ArrowDown" && dy === 0) {
                dx = 0;
                dy = box;
            } else if (key === "ArrowLeft" && dx === 0) {
                dx = -box;
                dy = 0;
            } else if (key === "ArrowRight" && dx === 0) {
                dx = box;
                dy = 0;
            }

            if (key.startsWith("Arrow")) {
                event.preventDefault();
            }
        });

        function updateGame() {
            if (!running) return;

            const head = {
                x: snake[0].x + dx,
                y: snake[0].y + dy
            };

            // Check wall collision
            if (
                head.x < 0 || head.x >= canvas.width ||
                head.y < 0 || head.y >= canvas.height
            ) {
                endGame();
                return;
            }

            // Check food collision
            const ateFood = head.x === food.x && head.y === food.y;

            // Allow movement into the old tail position
            const body = ateFood ? snake : snake.slice(0, -1);

            // Check collision with the snake body
            if (body.some(part =>
                part.x === head.x && part.y === head.y
            )) {
                endGame();
                return;
            }

            snake.unshift(head);

            if (ateFood) {
                score++;
                scoreElement.textContent = score;
                food = createFood();
            } else {
                snake.pop();
            }

            drawGame();
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw snake
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "lime" : "green";
                ctx.fillRect(part.x, part.y, box - 2, box - 2);
            });

            // Draw food
            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, box - 2, box - 2);
        }

        function endGame() {
            running = false;
            clearInterval(game);

            ctx.fillStyle = "white";
            ctx.font = "30px Arial";
            ctx.textAlign = "center";
            ctx.fillText(
                "Game Over!",
                canvas.width / 2,
                canvas.height / 2
            );
        }
    </script>

</body>
</html>
